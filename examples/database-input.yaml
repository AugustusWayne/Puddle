resource:
  group: myapp.io
  version: v1alpha1
  kind: Database
  scope: Namespaced          # or Cluster
  description: "Manages a self-hosted database instance"

  fields:
    - name: engine
      type: string
      required: true
      enum: [postgres, mysql, mongodb]
      description: "Database engine type"

    - name: replicas
      type: integer
      required: true
      minimum: 1
      maximum: 10
      description: "Number of database replicas"

    - name: storageGB
      type: integer
      required: false
      default: 20
      description: "Persistent storage size in GB"

    - name: version
      type: string
      required: false
      default: "latest"
      description: "Engine version tag"

    - name: enableBackups
      type: boolean
      required: false
      default: false
      description: "Enable automated backups"
